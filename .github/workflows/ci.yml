name: Cortexa CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Backend Quality & Tests
  # ============================================================================
  backend-ci:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cortexa
          POSTGRES_PASSWORD: cortexa_secret_dev
          POSTGRES_DB: cortexa_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run MyPy Type Check
        run: mypy apps/api/app

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://cortexa:cortexa_secret_dev@localhost:5432/cortexa_db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
        run: pytest apps/api/tests --tb=short

  # ============================================================================
  # Frontend Quality & Build
  # ============================================================================
  frontend-ci:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run type-check

      - name: Build Next.js Application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # ============================================================================
  # Docker Compose Configuration & Image Validation
  # ============================================================================
  docker-ci:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config

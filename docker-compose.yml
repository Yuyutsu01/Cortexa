services:
  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cortexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortexa_secret_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cortexa_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cortexa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortexa} -d ${POSTGRES_DB:-cortexa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # Redis Cache & Message Broker Service
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: cortexa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cortexa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # Cortexa FastAPI Backend API Service
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: cortexa-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-true}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_V1_PREFIX=/api/v1
      - ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - POSTGRES_USER=${POSTGRES_USER:-cortexa}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cortexa_secret_dev}
      - POSTGRES_DB=${POSTGRES_DB:-cortexa_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cortexa}:${POSTGRES_PASSWORD:-cortexa_secret_dev}@postgres:5432/${POSTGRES_DB:-cortexa_db}
      - DATABASE_SYNC_URL=postgresql+psycopg2://${POSTGRES_USER:-cortexa}:${POSTGRES_PASSWORD:-cortexa_secret_dev}@postgres:5432/${POSTGRES_DB:-cortexa_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cortexa-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Cortexa Next.js Web Frontend Service
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: cortexa-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - INTERNAL_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cortexa-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    name: cortexa_postgres_data
  redis_data:
    name: cortexa_redis_data

networks:
  cortexa-network:
    name: cortexa-network
    driver: bridge
